<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0c0d0f">
    <meta name="robots" content="noindex, nofollow">
    <title>Vision is unavailable — MPDEE Vision</title>
    <link rel="stylesheet" href="/offline.css">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="" width="64" height="64">
      <p class="eyebrow">MPDEE VISION</p>
      <h1>Vision is unavailable</h1>
      <p>Your connection may be offline, or Vision may be temporarily unavailable.</p>
      <p>Check your Wi-Fi or mobile data, then try again. Live cameras need a working connection.</p>
      <nav aria-label="Recovery options">
        <a class="primary" href="/watch">Try again</a>
        <a href="/setup">Private access setup</a>
      </nav>
      <p class="hint">If other websites work, give Vision a moment before trying again.</p>
    </main>
  </body>
</html>
